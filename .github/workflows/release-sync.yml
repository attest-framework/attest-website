name: Sync release docs

# Copies attest's CHANGELOG.md and docs/guides/*.md at a release tag into the
# website and opens a PR. attest's release.yml sends:
#   repository_dispatch  event_type: release-sync  client_payload: {"tag": "vX.Y.Z[-rc.N]"}
on:
  repository_dispatch:
    types: [release-sync]
  workflow_dispatch:
    inputs:
      tag:
        description: "attest release tag, e.g. v1.0.0-rc.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-sync-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate tag
        id: tag
        env:
          RAW_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag must match vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      # No persisted credentials: pnpm install/build run third-party code.
      # The token is supplied only to the final push step.
      - name: Checkout website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Checkout attest at tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: attest-framework/attest
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: .attest-src
          persist-credentials: false
          sparse-checkout: |
            /CHANGELOG.md
            /docs/guides/
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Sync files
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/sync-release.mjs .attest-src "$TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Open or update PR
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git add -A -- src/synced src/content/docs/sdk-guides
          if git diff --cached --quiet; then
            echo "::notice::CHANGELOG.md and guides at $TAG already match the website"
            exit 0
          fi
          branch="docs/release-sync-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "docs(changelog): sync changelog and guides from attest $TAG"
          # The branch is owned by this workflow; a rerun replaces it.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force origin "HEAD:refs/heads/$branch"
          if [[ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]]; then
            echo "::notice::updated existing PR for $branch"
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "docs(changelog): sync changelog and guides from attest $TAG" \
            --body "Copies \`CHANGELOG.md\` and \`docs/guides/*.md\` from attest-framework/attest at \`$TAG\`. Generated by \`.github/workflows/release-sync.yml\`; the site built successfully in the run that opened this PR."
