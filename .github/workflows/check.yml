name: Check

# Pull-request checks: the getting-started code must equal attest-examples at
# the commit pinned in src/examples/source.json, the sync scripts' tests pass,
# and the built site has no dead internal links. Read-only token, no secrets.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  examples-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned attest-examples commit
        id: source
        run: |
          commit=$(jq -r .commit src/examples/source.json)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=src/examples/source.json::commit must be a full 40-character sha"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout attest-examples at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: attest-framework/attest-examples
          ref: ${{ steps.source.outputs.commit }}
          path: .examples-src
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check getting-started code against attest-examples
        run: node scripts/sync-examples.mjs check .examples-src

      - name: Check that the mismatch fixture fails
        run: |
          if node scripts/sync-examples.mjs check .examples-src scripts/fixtures/examples-drift 2> drift.log; then
            echo "::error::drift check accepted scripts/fixtures/examples-drift"
            exit 1
          fi
          cat drift.log
          if ! grep -qx "  differs: quickstart/test_agent.py" drift.log; then
            echo "::error::drift check failed on the fixture for the wrong reason"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (mermaid build-time rendering)
        run: pnpm exec playwright install --with-deps chromium

      - name: Test sync scripts
        run: pnpm test

      - name: Build site
        run: pnpm build

      - name: Check internal links
        run: node scripts/check-links.mjs dist

  # Single always-reporting gate for the branch ruleset. `if: always()` makes it
  # run (and fail) when a needed job fails or is cancelled, so a PR never sits
  # on a skipped required check.
  required:
    if: always()
    needs: [examples-drift, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | all(. == "success")' > /dev/null; then
            exit 0
          fi
          echo "::error::a required job did not succeed"
          exit 1
